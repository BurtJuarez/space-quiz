<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Exploration Quiz</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1c2233;
    --muted: #5b6478;
    --border: #dfe3ec;
    --accent: #5b5bf0;
    --focus: #3730a3;
    --accent-2: #9b4dff;
    --correct: #1fa954;
    --correct-bg: #e3f8eb;
    --wrong: #e0383e;
    --wrong-bg: #fde7e8;
    --shadow: 0 10px 30px rgba(30, 40, 80, .10);
    --mc-bg: #e9f2ee;
    --mc-text: #0a5a36;
    --mc-line: #8fc4a9;
    --mc-inner: rgba(255, 255, 255, .7);
    --mc-scan: rgba(10, 90, 54, .05);
    --mc-glow: transparent;
    --star: #5b5bf0;
    --star-opacity: .55;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1020;
      --card: #171b2f;
      --text: #e8eaf4;
      --muted: #9aa1b9;
      --border: #2a3050;
      --accent: #7b7bff;
      --focus: #c7d2fe;
      --accent-2: #b67bff;
      --correct: #3ddc84;
      --correct-bg: #14321f;
      --wrong: #ff5c63;
      --wrong-bg: #3a1619;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
      --mc-bg: #06140e;
      --mc-text: #5cf2a0;
      --mc-line: #1f6b47;
      --mc-inner: rgba(92, 242, 160, .08);
      --mc-scan: rgba(92, 242, 160, .06);
      --mc-glow: rgba(92, 242, 160, .25);
      --star: #ffffff;
      --star-opacity: .8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 440px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 {
    display: inline-flex; align-items: center; gap: 10px;
    margin: 0 0 8px; padding: 10px 16px;
    font-family: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 17px; font-weight: 700; line-height: 1.2;
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--mc-text);
    background:
      repeating-linear-gradient(0deg, var(--mc-scan) 0 1px, transparent 1px 3px),
      var(--mc-bg);
    border: 1px solid var(--mc-line);
    border-radius: 8px;
    box-shadow: inset 0 0 0 1px var(--mc-inner), 0 0 18px var(--mc-glow);
    text-shadow: 0 0 6px var(--mc-glow);
  }
  header h1 .mc-light {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--mc-text);
    box-shadow: 0 0 6px var(--mc-text);
    animation: mc-pulse 1.6s ease-in-out infinite;
  }
  @keyframes mc-pulse { 50% { opacity: .35; } }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 22px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }
  .card::before {
    background-image:
      radial-gradient(circle at 12% 18%, var(--star) 0 .8px, transparent 1.3px),
      radial-gradient(circle at 68% 9%, var(--star) 0 .8px, transparent 1.3px),
      radial-gradient(circle at 85% 42%, var(--star) 0 1px, transparent 1.6px),
      radial-gradient(circle at 33% 61%, var(--star) 0 .8px, transparent 1.3px),
      radial-gradient(circle at 52% 88%, var(--star) 0 .8px, transparent 1.3px),
      radial-gradient(circle at 7% 79%, var(--star) 0 1px, transparent 1.6px),
      radial-gradient(circle at 93% 92%, var(--star) 0 .8px, transparent 1.3px),
      radial-gradient(circle at 44% 31%, var(--star) 0 .8px, transparent 1.3px),
      radial-gradient(circle at 76% 70%, var(--star) 0 1px, transparent 1.6px),
      radial-gradient(circle at 24% 46%, var(--star) 0 .8px, transparent 1.3px);
    background-size: 220px 220px;
    opacity: var(--star-opacity);
    animation: star-drift 120s linear infinite;
  }
  .card::after {
    background-image:
      radial-gradient(circle at 22% 35%, var(--star) 0 1.2px, transparent 1.9px),
      radial-gradient(circle at 76% 16%, var(--star) 0 1px, transparent 1.6px),
      radial-gradient(circle at 48% 74%, var(--star) 0 1.5px, transparent 2.2px),
      radial-gradient(circle at 88% 57%, var(--star) 0 1px, transparent 1.6px),
      radial-gradient(circle at 9% 92%, var(--star) 0 1.2px, transparent 1.9px);
    background-size: 290px 290px;
    opacity: var(--star-opacity);
    animation: star-twinkle 6s ease-in-out infinite;
  }
  @keyframes star-drift { to { background-position: 220px 110px; } }
  @keyframes star-twinkle { 50% { opacity: calc(var(--star-opacity) * .35); } }
  .meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: var(--muted); margin-bottom: 8px;
  }
  .score { font-weight: 600; color: var(--text); }
  .score span { display: inline-block; transition: transform .25s; }
  .score span.bump { transform: scale(1.4); color: var(--correct); }
  .progress {
    height: 8px; border-radius: 99px; background: var(--border);
    overflow: hidden; margin-bottom: 20px;
  }
  .progress > div {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 99px;
    transition: width .45s cubic-bezier(.4, 0, .2, 1);
  }
  .question { font-size: 17px; font-weight: 600; margin: 0 0 16px; }
  .options { display: grid; gap: 10px; }
  .option {
    font: inherit; color: inherit; text-align: left;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:active:not(:disabled) { transform: scale(.98); }
  .option:focus-visible, .btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }
  [tabindex="-1"]:focus { outline: none; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .option:disabled { cursor: default; }
  .option.correct {
    border-color: var(--correct); background: var(--correct-bg);
    animation: pop .45s ease;
  }
  .option.wrong {
    border-color: var(--wrong); background: var(--wrong-bg);
    animation: shake .45s ease;
  }
  .option.dim { opacity: .5; }
  .feedback {
    min-height: 24px; margin-top: 14px; font-size: 14px; font-weight: 600;
    opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s;
  }
  .feedback.show { opacity: 1; transform: none; }
  .feedback.good { color: var(--correct); }
  .feedback.bad { color: var(--wrong); }
  .btn {
    font: inherit; font-weight: 600;
    width: 100%; margin-top: 14px; padding: 11px;
    border: 0; border-radius: 10px; cursor: pointer;
    color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: filter .15s, transform .1s, opacity .2s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.98); }
  .btn[hidden] { display: none; }
  .fade { animation: fadeIn .35s ease; }
  .results { text-align: center; }
  .emoji { font-size: 64px; line-height: 1; animation: bounce 1s ease; }
  .results h2 { margin: 12px 0 4px; font-size: 20px; }
  .results .big { font-size: 30px; font-weight: 700; margin: 8px 0; }
  .results p { color: var(--muted); margin: 0; font-size: 14px; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); box-shadow: 0 0 0 6px color-mix(in srgb, var(--correct) 25%, transparent); }
    100% { transform: scale(1); }
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes bounce {
    0% { transform: scale(0); } 60% { transform: scale(1.25); } 100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    header h1 .mc-light, .card::before, .card::after { animation: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1><span class="mc-light" aria-hidden="true"></span><span aria-hidden="true">🚀</span> Space Exploration Quiz</h1>
    <p>10 questions about humanity's journey to the stars</p>
  </header>
  <section class="card" id="card"></section>
  <div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>
</main>

<script>
  const QUESTIONS = [
    { q: "Who was the first human to travel into space?", a: ["Neil Armstrong", "Yuri Gagarin", "Alan Shepard", "John Glenn"], c: 1 },
    { q: "Which mission made the first crewed Moon landing in 1969?", a: ["Apollo 8", "Apollo 13", "Apollo 11", "Gemini 4"], c: 2 },
    { q: "What was the first artificial satellite, launched in 1957?", a: ["Explorer 1", "Vostok 1", "Telstar", "Sputnik 1"], c: 3 },
    { q: "Which is the largest planet in our solar system?", a: ["Jupiter", "Saturn", "Neptune", "Uranus"], c: 0 },
    { q: "Who was the first American woman in space?", a: ["Mae Jemison", "Valentina Tereshkova", "Sally Ride", "Eileen Collins"], c: 2 },
    { q: "Which NASA rover landed in Mars' Jezero Crater in February 2021?", a: ["Curiosity", "Perseverance", "Opportunity", "Spirit"], c: 1 },
    { q: "Which spacecraft is the most distant human-made object from Earth?", a: ["Voyager 1", "Pioneer 10", "New Horizons", "Voyager 2"], c: 0 },
    { q: "Which space telescope launched on December 25, 2021?", a: ["Hubble", "Spitzer", "Kepler", "James Webb"], c: 3 },
    { q: "Which world did NASA's New Horizons fly past in July 2015?", a: ["Ceres", "Pluto", "Eris", "Titan"], c: 1 },
    { q: "In what year did the first crew move into the International Space Station?", a: ["1998", "2000", "2003", "2011"], c: 1 },
  ];

  function shuffle(arr) {
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function shuffledQuestions() {
    return shuffle(QUESTIONS).map(({ q, a, c }) => {
      const order = shuffle(a.map((_, i) => i));
      return { q, a: order.map(i => a[i]), c: order.indexOf(c) };
    });
  }

  const card = document.getElementById("card");
  let questions = shuffledQuestions(), index = 0, score = 0;

  function renderQuestion(moveFocus = false) {
    const item = questions[index];
    card.innerHTML = `
      <div class="fade">
        <div class="meta">
          <span id="q-num">Question ${index + 1} of ${QUESTIONS.length}</span>
          <span class="score">Score: <span id="score">${score}</span></span>
        </div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${QUESTIONS.length}" aria-valuenow="${index}">
          <div id="bar" style="width:${(index / QUESTIONS.length) * 100}%"></div>
        </div>
        <p class="question" id="q-text">${item.q}</p>
        <div class="options" role="group" aria-labelledby="q-num q-text">
          ${item.a.map((t, i) => `<button class="option" data-i="${i}">${t}</button>`).join("")}
        </div>
        <div class="feedback" id="feedback" aria-hidden="true"></div>
        <button class="btn" id="next" hidden>${index === QUESTIONS.length - 1 ? "See results" : "Next question →"}</button>
      </div>`;
    card.querySelectorAll(".option").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
    document.getElementById("next").addEventListener("click", next);
    if (moveFocus) card.querySelector(".option").focus();
  }

  function announce(text) {
    const status = document.getElementById("sr-status");
    status.textContent = "";
    setTimeout(() => { status.textContent = text; }, 50);
  }

  function choose(i) {
    const item = questions[index];
    const buttons = [...card.querySelectorAll(".option")];
    const fb = document.getElementById("feedback");
    buttons.forEach(b => b.disabled = true);
    const right = i === item.c;
    buttons[item.c].classList.add("correct");
    if (right) {
      score++;
      const s = document.getElementById("score");
      s.textContent = score;
      s.classList.add("bump");
      setTimeout(() => s.classList.remove("bump"), 300);
      fb.textContent = "✅ Correct!";
      fb.className = "feedback good";
    } else {
      buttons[i].classList.add("wrong");
      fb.textContent = `❌ Not quite — it's ${item.a[item.c]}.`;
      fb.className = "feedback bad";
    }
    buttons.forEach((b, j) => { if (j !== item.c && j !== i) b.classList.add("dim"); });
    announce(right ? `Correct! Score ${score} of ${QUESTIONS.length}.` : `Wrong. The answer is ${item.a[item.c]}.`);
    requestAnimationFrame(() => fb.classList.add("show"));
    const bar = document.getElementById("bar");
    bar.style.width = `${((index + 1) / QUESTIONS.length) * 100}%`;
    bar.parentElement.setAttribute("aria-valuenow", index + 1);
    const nextBtn = document.getElementById("next");
    nextBtn.hidden = false;
    nextBtn.focus();
  }

  function next() {
    index++;
    index < QUESTIONS.length ? renderQuestion(true) : renderResults();
  }

  function renderResults() {
    const pct = score / QUESTIONS.length;
    const [emoji, title, msg] =
      pct === 1  ? ["🤩", "Perfect score!", "You're ready for mission control."] :
      pct >= .8  ? ["🚀", "Stellar work!", "You really know your space history."] :
      pct >= .5  ? ["🙂", "Solid orbit!", "A few more trips around the sun and you'll ace it."] :
      pct >= .3  ? ["😅", "Houston, we have a problem…", "Time to brush up on your space facts."] :
                   ["😵", "Lost in space!", "Give it another launch — you'll do better."];
    card.innerHTML = `
      <div class="results fade">
        <div class="emoji" aria-hidden="true">${emoji}</div>
        <h2 id="result-title" tabindex="-1">${title}</h2>
        <div class="big">${score} / ${QUESTIONS.length}</div>
        <div class="progress" aria-hidden="true"><div style="width:${pct * 100}%"></div></div>
        <p>${msg}</p>
        <button class="btn" id="restart">Play again</button>
      </div>`;
    document.getElementById("restart").addEventListener("click", () => { questions = shuffledQuestions(); index = 0; score = 0; renderQuestion(true); });
    document.getElementById("result-title").focus();
    announce(`Quiz complete. You scored ${score} out of ${QUESTIONS.length}. ${title}`);
  }

  renderQuestion();
</script>
</body>
</html>
